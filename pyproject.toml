[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "di-nids"
version = "0.1.0"
description = "Research implementation of the Domain Invariant Network Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Siamak Layeghy"},
  {name = "Mahsa Baktashmotlagh"},
  {name = "Marius Portmann"},
]
keywords = [
  "network intrusion detection",
  "domain adaptation",
  "DANN",
  "one-class SVM",
  "NetFlow",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=1.5,<3",
  "scikit-learn>=1.2,<2",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
dinids = "dinids.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

